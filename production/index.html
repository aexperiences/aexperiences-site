<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Production &middot; Accelerated Experiences</title>
<link rel="icon" href="/marks/ae-mark-gradient.png">
<script src="/ae-gate.js"
        data-app="ops" data-name="Production"
        data-tag="Where every AE product actually lives"
        data-price="Internal" data-trial="0"
        data-accent="#3E6B4F" data-icon="/marks/ae-mark-gradient.png"></script>
<style>
  :root{
    --p:#14100E; --p2:#1C1714; --card:#211B18; --line:#332B26; --line2:#292220;
    --ink:#F2ECE2; --ink2:#A99C8C;
    --ok:#7FA46A; --bad:#D9633C; --warn:#C9A24A; --info:#7E8CA8;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Karla",-apple-system,system-ui,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--p);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:60px}
  .wrap{max-width:1180px;margin-inline:auto;padding-inline:18px}
  header{border-bottom:1px solid var(--line);background:var(--p2);position:sticky;top:0;z-index:5}
  header .wrap{display:flex;align-items:center;gap:13px;padding-block:13px;flex-wrap:wrap}
  header img{width:34px;height:34px}
  h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
  .stamp{font-size:11.5px;color:var(--ink2);font-family:var(--mono)}
  .lede{color:var(--ink2);font-size:14.5px;margin:22px 0 0;max-width:70ch}

  .score{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-top:20px}
  .s{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 15px}
  .s b{display:block;font-size:27px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .s span{display:block;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
    color:var(--ink2);margin-top:7px}
  .s.bad b{color:var(--bad)} .s.ok b{color:var(--ok)} .s.warn b{color:var(--warn)}

  h2{font-size:15px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2);
    margin:34px 0 0}
  .tbl{margin-top:11px;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--card)}
  .r{display:grid;grid-template-columns:1.5fr .7fr 1.6fr 1.1fr 1.5fr .8fr;gap:12px;
    padding:11px 15px;border-top:1px solid var(--line2);align-items:center;font-size:13.5px}
  .r:first-child{border-top:0;background:var(--p2);font-size:10.5px;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
  .r b{font-weight:600}
  .r .m{font-family:var(--mono);font-size:12px;color:var(--ink2);overflow-wrap:anywhere}
  .pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    padding:4px 8px;border-radius:6px;white-space:nowrap}
  .pill.locked{background:rgba(127,164,106,.18);color:var(--ok)}
  .pill.OPEN{background:rgba(217,99,60,.2);color:var(--bad)}
  .pill.other{background:rgba(126,140,168,.18);color:var(--info)}
  .pill.warn{background:rgba(201,162,74,.18);color:var(--warn)}
  .miss{color:var(--warn);font-family:var(--mono);font-size:12px}
  .note{margin-top:30px;font-size:13px;color:var(--ink2);line-height:1.6;max-width:78ch}
  .note code{font-family:var(--mono);font-size:12px;background:var(--p2);padding:2px 5px;border-radius:4px}
  @media (max-width:860px){
    .r{grid-template-columns:1fr auto;gap:5px 10px;padding:13px 14px}
    .r:first-child{display:none}
    .r .c3,.r .c4,.r .c5{grid-column:1/-1}
    .r .c2{text-align:right}
  }
</style>
</head><body>

<header><div class="wrap">
  <img src="/marks/ae-mark-gradient.png" alt="">
  <div style="flex:1"><h1>Production</h1>
    <div class="stamp" id="stamp">&nbsp;</div></div>
</div></header>

<main class="wrap">
  <p class="lede">Every product, where it actually deploys from, and whether a stranger can
    walk into it. The door column is <b>checked against the files</b>, not typed &mdash; a
    register that says a door is locked because somebody wrote that down is worse than none.</p>

  <div class="score" id="score"></div>
  <div id="tables"></div>

  <p class="note" id="foot"></p>
</main>

<script>
(function(){
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};

  fetch('/production.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    document.getElementById('stamp').textContent =
      'generated ' + d.generated + ' · vercel map read ' + d.vercelSeen;

    var P=d.products;
    var soldLive=P.filter(function(p){return p.sold && p.state==='live';});
    var open=soldLive.filter(function(p){return p.door==='OPEN';});
    var unchecked=soldLive.filter(function(p){return p.door==='not in this repo'||p.door==='unknown';});
    var noProj=P.filter(function(p){return !p.where.project || p.where.project==='?';});

    document.getElementById('score').innerHTML=
      tile(P.length,'products') +
      tile(soldLive.length,'sold &amp; live') +
      tile(open.length,'doors open', open.length?'bad':'ok') +
      tile(unchecked.length,'unverifiable here', unchecked.length?'warn':'ok') +
      tile(noProj.length,'no vercel project', noProj.length?'warn':'ok');

    var T=document.getElementById('tables');
    T.innerHTML =
      section('Sold consumer apps', soldLive) +
      section('Business OS &amp; tools', P.filter(function(p){return p.tiers||p.genre==='business';})) +
      section('Free / in testing', P.filter(function(p){return !p.sold && !p.tiers && p.genre!=='business' && p.state==='live';})) +
      section('Not live yet', P.filter(function(p){return p.state!=='live';}));

    var blind = P.filter(function(p){ return (!p.where.project||p.where.project==='?') && p.state==='live'; });
    var nolane = P.filter(function(p){ return p.door==='no git lane'; });
    if(nolane.length){
      document.getElementById('tables').insertAdjacentHTML('afterbegin',
        '<h2 style="color:var(--bad)">Live and sold, with no git repo behind it · '+nolane.length+'</h2>'+
        '<div class="tbl"><div class="r" style="grid-template-columns:1fr">'+
        '<span>'+nolane.map(function(p){return '<b>'+esc(p.name)+'</b> <span class="m">'+esc(p.where.project)+' · '+esc(p.where.host)+'</span>';}).join(' &nbsp;·&nbsp; ')+
        '<br><span class="m" style="color:var(--ink2)">No history, no deploy lane, and nowhere to put a door.</span></span></div></div>');
    }

    if(blind.length){
      document.getElementById('tables').insertAdjacentHTML('afterbegin',
        '<h2 style="color:var(--warn)">Serving from somewhere this account cannot see · '+blind.length+'</h2>'+
        '<div class="tbl"><div class="r" style="grid-template-columns:1fr">'+
        '<span>'+blind.map(function(p){return esc(p.name)+' <span class="m">'+esc(p.where.host||p.url||'?')+'</span>';}).join(' &nbsp;·&nbsp; ')+
        '</span></div></div>');
    }

    document.getElementById('foot').innerHTML =
      'Rebuild with <code>python3 _ops/build-production-registry.py</code>. The Vercel column is the '+
      'one part typed by hand, from the Vercel API on '+esc(d.vercelSeen)+' — if a project is added or '+
      'renamed, that map is what goes stale, and a blank there is the registry telling you so rather '+
      'than guessing.';
  }).catch(function(){
    document.getElementById('score').innerHTML='<p class="miss">production.json did not load.</p>';
  });

  function tile(n,label,cls){
    return '<div class="s'+(cls?' '+cls:'')+'"><b>'+n+'</b><span>'+label+'</span></div>';
  }
  function section(title,rows){
    if(!rows.length) return '';
    return '<h2>'+title+' · '+rows.length+'</h2><div class="tbl">'+
      '<div class="r"><span>Product</span><span>Price</span><span>Lives at</span>'+
      '<span>Vercel</span><span>GitHub</span><span>Door</span></div>'+
      rows.map(row).join('')+'</div>';
  }
  function row(p){
    var w=p.where||{};
    var price = p.plans && p.plans.length
      ? '$'+p.plans[0][1].toFixed(2)+(p.plans[0][2]==='year'?'/yr':'/mo')
      : (p.tiers?'tiered':'—');
    var lives = w.host ? (w.host + (w.path && w.path!=='/' ? w.path : '')) : '<span class="miss">unresolved</span>';
    var proj  = w.project && w.project!=='?' ? esc(w.project) : '<span class="miss">none found</span>';
    var repo  = w.repo ? esc(w.repo) : '<span class="miss">'+(w.project?'no repo attached':'unknown')+'</span>';
    var cls   = p.door==='locked' ? 'locked'
              : p.door==='OPEN' ? 'OPEN'
              : (p.door==='n/a'||p.door==='not live'||p.door==='open by design') ? 'other'
              : 'warn';
    return '<div class="r">'+
      '<span class="c1"><b>'+esc(p.name)+'</b><br><span class="m">'+esc(p.id)+'</span></span>'+
      '<span class="c2">'+price+'</span>'+
      '<span class="c3 m">'+lives+'</span>'+
      '<span class="c4 m">'+proj+'</span>'+
      '<span class="c5 m">'+repo+'</span>'+
      '<span class="c6"><span class="pill '+cls+'">'+esc(p.door)+'</span></span></div>';
  }
})();
</script>
</body></html>
