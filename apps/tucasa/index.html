<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tu Casa OS — in development</title>
<meta name="description" content="Tu Casa OS — the home operating system. In development at Accelerated Experiences LLC.">
<meta name="robots" content="noindex">
<link rel="icon" href="icon.png">
<style>
  :root{ --terra:#c45c3c; --espresso:#2a1810; --cream:#f4eede; --gold:#e0a83a; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:linear-gradient(150deg,var(--espresso),#3b2417 60%,#1c120b);
        font-family:Georgia,'Times New Roman',serif; color:var(--cream); padding:24px; }
  .card{ max-width:560px; text-align:center; padding:56px 36px; border:1px solid rgba(224,168,58,.25);
         border-radius:18px; background:rgba(244,238,222,.04); }
  img.icon{ width:88px; height:88px; border-radius:22px; margin-bottom:22px;
            box-shadow:0 10px 30px rgba(0,0,0,.45); }
  .kicker{ font-family:'Courier New',monospace; font-weight:bold; letter-spacing:.18em;
           font-size:12px; color:var(--gold); text-transform:uppercase; margin-bottom:14px; }
  h1{ font-size:34px; line-height:1.15; margin-bottom:14px; }
  h1 span{ color:var(--terra); }
  p{ font-size:16px; line-height:1.6; color:rgba(244,238,222,.82); margin-bottom:10px; }
  .rule{ width:64px; height:2px; background:var(--gold); opacity:.6; margin:22px auto; }
  a.back{ display:inline-block; margin-top:8px; padding:12px 26px; border:1px solid var(--gold);
          border-radius:999px; color:var(--cream); text-decoration:none; font-size:15px;
          letter-spacing:.04em; }
  a.back:hover{ background:rgba(224,168,58,.12); }
  footer{ margin-top:30px; font-size:12px; color:rgba(244,238,222,.45);
          font-family:'Courier New',monospace; letter-spacing:.08em; }
</style></head><body>
<main class="card">
  <img class="icon" src="icon.png" alt="Tu Casa OS">
  <div class="kicker">In development</div>
  <h1>Tu Casa <span>OS</span></h1>
  <p>The home operating system — the wall screen that fills itself — is back in the workshop.</p>
  <p>It isn't what it's going to be yet, and we don't put anything on the floor before it's right.</p>
  <div class="rule"></div>
  <a class="back" href="/shop.html">Browse the App Shop</a>
  <footer>ACCELERATED EXPERIENCES LLC</footer>
</main>
</body></html>
