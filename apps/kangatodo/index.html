<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KangaToDo — jobs hop from your phone to theirs</title>
<meta name="description" content="A grown-up pops a job on their phone and picks a kid. It lands on the Skylight and buzzes that kid's phone — and only that kid's. Every child in the house, each with their own pouch. From Accelerated Experiences LLC.">
<meta name="theme-color" content="#FFF9F0">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.png">
<link rel="icon" href="./icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KangaToDo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* pastel — pinks, yellows, creams. Every text pair solved to WCAG AA before a line was drawn. */
  --cream:#FFF9F0; --card:#FFFFFF; --sand:#FDF0DA; --field:#FFFCF6;
  --line:#F3DFC8; --hair:#F8EBD8;
  --ink:#4A2C38; --ink2:#7A5B67; --mut:#876471;
  --blush:#F7B7C8; --blush-d:#E28FA6; --blush-l:#FFE3EA;
  --rose:#CD3B66; --rose-cta:#C4416B;
  --butter:#FDE49A; --sun:#F7C948; --sunbg:#FFF6DF;
  --ok:#3C7C53; --okbg:#EAF7EF; --warn:#926A21;
  --round:'Fredoka',system-ui,sans-serif; --sans:'Nunito',system-ui,-apple-system,sans-serif;
  --tap:54px; --r:20px; --wrap:640px;
  --sh:0 2px 0 var(--line), 0 8px 22px rgba(74,44,56,.07);
  --ease-out:cubic-bezier(.22,.9,.28,1);
  --ease-spring:cubic-bezier(.34,1.42,.5,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  overscroll-behavior-y:contain;padding:0 0 env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 18px}
h1,h2,h3{font-family:var(--round);font-weight:600;letter-spacing:-.005em;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--rose);text-underline-offset:3px}

/* ---------- chrome ---------- */
header.top{position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,var(--cream) 74%,rgba(255,249,240,0));
  padding:calc(env(safe-area-inset-top) + 14px) 0 10px}
.brandrow{display:flex;align-items:center;gap:10px}
.brandmark{width:38px;height:38px;flex:none;border-radius:12px;background:var(--blush-l);
  border:2px solid var(--blush);display:grid;place-items:center;overflow:hidden}
.brandmark svg{width:30px;height:30px;display:block}
.brandname{font-family:var(--round);font-size:21px;font-weight:600;letter-spacing:-.01em}
.brandname i{font-style:normal;color:var(--rose)}
.brandsub{font-size:12px;color:var(--mut);margin-top:-3px}
.spacer{flex:1}

/* ---------- cards ---------- */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:18px;margin:14px 0}
.card h2{font-size:19px;margin-bottom:3px}
.card .sub{font-size:13.5px;color:var(--ink2);margin-bottom:12px}
.hr{height:2px;background:var(--hair);margin:14px -18px}

/* ---------- status pills ---------- */
.status{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 4px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  padding:6px 11px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink2)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--mut);flex:none}
.pill.on{color:var(--ok);border-color:#BFE3CC;background:var(--okbg)}
.pill.on .dot{background:var(--ok)}
.pill.off{color:var(--warn);border-color:#F2DFAE;background:var(--sunbg)}
.pill.off .dot{background:var(--sun)}

/* ---------- buttons — chunky, kid-proof ---------- */
.btn{min-height:var(--tap);padding:0 20px;border-radius:16px;background:var(--rose-cta);color:#fff;
  font-family:var(--round);font-weight:600;font-size:16px;display:inline-flex;align-items:center;
  justify-content:center;gap:8px;width:100%;box-shadow:0 3px 0 #A33357;
  transition:transform .14s var(--ease-spring),box-shadow .14s var(--ease-out)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 #A33357}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.ghost{background:var(--card);color:var(--rose);border:2px solid var(--blush);box-shadow:0 3px 0 var(--blush)}
.btn.ghost:active{box-shadow:0 0 0 var(--blush)}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 3px 0 #D9A916}
.btn.sun:active{box-shadow:0 0 0 #D9A916}
.btn.sm{min-height:42px;font-size:14.5px;padding:0 15px;width:auto;box-shadow:0 2px 0 var(--blush)}
.rm{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;
  color:var(--mut);opacity:.55;transition:opacity .18s var(--ease-out),background .18s var(--ease-out)}
.rm svg{width:17px;height:17px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.rm:hover,.rm:focus-visible,.rm:active{opacity:1;color:var(--rose);background:var(--blush-l)}

/* ---------- fields ---------- */
label.lbl{display:block;font-family:var(--round);font-size:13px;font-weight:600;color:var(--ink2);margin:14px 0 6px}
.inp{width:100%;min-height:var(--tap);padding:12px 15px;border:2px solid var(--line);border-radius:15px;
  background:var(--field);outline:none;transition:border-color .18s var(--ease-out),box-shadow .18s var(--ease-out)}
.inp:focus{border-color:var(--blush-d);box-shadow:0 0 0 4px var(--blush-l)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.fold{margin-top:8px}
.fold>summary{list-style:none;cursor:pointer;font-size:13px;color:var(--ink2);padding:8px 0;
  font-weight:700;display:inline-flex;align-items:center;gap:7px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:'+';font-family:var(--round);font-size:15px;width:20px;height:20px;
  border-radius:7px;background:var(--blush-l);color:var(--rose);display:grid;place-items:center;font-weight:600;line-height:1}
.fold[open]>summary::before{content:'–'}

/* ---------- child chips ---------- */
.kids{display:flex;gap:10px;overflow-x:auto;padding:2px 18px 8px;margin:0 -18px;
  scrollbar-width:none;scroll-snap-type:x proximity}
.kids::-webkit-scrollbar{display:none}
.kid{flex:none;min-width:104px;padding:13px;border-radius:18px;background:var(--card);
  border:2.5px solid var(--line);text-align:left;scroll-snap-align:start;
  transition:transform .18s var(--ease-spring),border-color .18s var(--ease-out),background .18s var(--ease-out)}
.kid:active{transform:scale(.96)}
.kid[aria-pressed="true"]{border-color:var(--blush-d);background:var(--blush-l)}
.kid .swatch{width:30px;height:30px;border-radius:11px;margin-bottom:9px;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:14px;font-family:var(--round)}
.kid .nm{font-family:var(--round);font-weight:600;font-size:15.5px}
.kid .st{font-size:11.5px;color:var(--mut);margin-top:1px}

/* ---------- chore rows ---------- */
.chore{display:flex;align-items:center;gap:13px;padding:14px 2px;border-bottom:2px solid var(--hair)}
.chore:last-child{border-bottom:0}
.tick{width:36px;height:36px;flex:none;border-radius:50%;border:3px solid var(--blush);
  background:var(--card);display:grid;place-items:center;
  transition:transform .2s var(--ease-spring),background .2s var(--ease-out),border-color .2s var(--ease-out)}
.tick svg{width:17px;height:17px;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;
  stroke-linejoin:round;opacity:0;transform:scale(.4);
  transition:opacity .18s var(--ease-out),transform .26s var(--ease-spring)}
.tick[aria-checked="true"]{background:var(--sun);border-color:var(--sun)}
.tick[aria-checked="true"] svg{opacity:1;transform:scale(1);stroke:var(--ink)}
.tick:active{transform:scale(.88)}
.chore .body{flex:1;min-width:0}
.chore .ttl{font-family:var(--round);font-weight:500;font-size:16.5px;word-break:break-word}
.chore[data-done="1"] .ttl{color:var(--mut);text-decoration:line-through;text-decoration-color:var(--blush)}
.chore .meta{font-size:13px;color:var(--mut);margin-top:1px;display:flex;gap:8px;flex-wrap:wrap}
.star{color:var(--warn);font-weight:700}

/* ---------- notices ---------- */
.empty{text-align:center;padding:26px 14px;color:var(--ink2)}
.empty .big{font-family:var(--round);font-size:19px;font-weight:600;color:var(--ink);margin-bottom:5px}
.notice{border-radius:16px;padding:13px 15px;font-size:14px;line-height:1.5;
  background:var(--sunbg);border:2px solid #F2DFAE;color:#6E5014;margin:12px 0}
.notice.bad{background:var(--blush-l);border-color:var(--blush);color:#8A2F4C}
.notice.good{background:var(--okbg);border-color:#BFE3CC;color:#2C5E3E}
.notice b{font-weight:800}
.notice code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  background:rgba(74,44,56,.07);padding:2px 6px;border-radius:6px}

/* ---------- join code ---------- */
.code{font-family:var(--round);font-size:42px;font-weight:600;letter-spacing:.12em;text-align:center;
  color:var(--rose);padding:14px 0 4px}
.codehint{text-align:center;font-size:13.5px;color:var(--ink2);padding-bottom:4px}

/* ══════════════════ KID MODE ══════════════════ */
body.kid{background:var(--cream)}
body.kid .wrap{max-width:520px}
.kidhead{padding:calc(env(safe-area-inset-top) + 18px) 0 0;text-align:center}
.kidhello{font-family:var(--round);font-size:30px;font-weight:600;letter-spacing:-.02em}
.kiddate{font-size:14px;color:var(--mut);margin-top:1px}
.roo{width:236px;margin:-6px auto -12px;display:block}
.roo.hop{animation:hop .85s var(--ease-spring)}
@keyframes hop{0%{transform:translateY(0)}28%{transform:translateY(-24px) rotate(-7deg)}
  55%{transform:translateY(0)}72%{transform:translateY(-9px)}100%{transform:translateY(0)}}
/* The star's POSITION lives on a wrapper <g transform=…>; the CSS pop animates the
   inner <path> only. Putting both on one element makes CSS clobber the SVG attribute
   and the star lands in the corner instead of the pouch. */
.roo .pstar{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.25);
  transition:opacity .35s var(--ease-out),transform .5s var(--ease-spring)}
.roo .pstar.in{opacity:1;transform:scale(1)}
.togo{text-align:center;font-family:var(--round);font-size:20px;font-weight:600;margin:2px 0 6px}
.togo b{color:var(--rose)}
.bar{height:14px;border-radius:999px;background:var(--sand);border:2px solid var(--line);
  overflow:hidden;margin:8px 34px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--butter),var(--sun));
  border-radius:999px;transition:width .6s var(--ease-out)}
.allclear{text-align:center;padding:6px 10px 0;animation:pop .55s var(--ease-spring)}
.allclear .tx{font-family:var(--round);font-size:23px;font-weight:600;color:var(--rose)}
.allclear .sm{font-size:14px;color:var(--ink2);margin-top:2px}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(10px)}to{opacity:1;transform:none}}

/* ---------- footer / toast ---------- */
footer{margin:26px 0 30px;padding-top:16px;border-top:2px solid var(--hair);
  font-size:12.5px;color:var(--mut);line-height:1.6}
footer img{height:14px;vertical-align:-2px;margin-right:6px;opacity:.8}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,120%);
  background:var(--ink);color:#FFF6EC;padding:13px 20px;border-radius:16px;font-size:14.5px;font-weight:700;
  z-index:90;max-width:calc(100vw - 36px);text-align:center;box-shadow:0 8px 30px rgba(74,44,56,.25);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:transform .34s var(--ease-spring),opacity .2s var(--ease-out),visibility 0s .34s}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition-delay:0s}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:5px;background:var(--sand);border:2px solid var(--line);border-radius:16px;padding:5px;margin:12px 0 2px}
.tabs button{flex:1;min-height:42px;border-radius:12px;font-family:var(--round);font-size:15px;
  font-weight:500;color:var(--ink2);transition:background .2s var(--ease-out),color .2s var(--ease-out)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--rose);font-weight:600;box-shadow:0 2px 0 var(--line)}

/* proof photos */
.cam{width:36px;height:36px;flex:none;border-radius:50%;border:3px dashed var(--sun);
  background:var(--sunbg);display:grid;place-items:center;
  transition:transform .2s var(--ease-spring),background .2s var(--ease-out)}
.cam svg{width:17px;height:17px;stroke:var(--warn);stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cam:active{transform:scale(.88);background:var(--butter)}
.thumb{width:46px;height:46px;flex:none;border-radius:13px;object-fit:cover;
  border:2px solid var(--line);background:var(--sand);display:block}
.shotwrap{margin-top:10px}
.shotwrap img{width:100%;border-radius:16px;border:2px solid var(--line);display:block}
.needs{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--warn);
  background:var(--sunbg);border:1.5px solid #F2DFAE;border-radius:999px;padding:2px 8px}
.check{display:flex;align-items:center;gap:11px;padding:13px;border:2px solid var(--line);
  border-radius:15px;background:var(--field);margin-top:14px;cursor:pointer}
.check input{width:24px;height:24px;flex:none;accent-color:var(--rose-cta);margin:0}
.check b{font-family:var(--round);font-weight:600;font-size:15px;display:block}
.check span{font-size:12.5px;color:var(--ink2)}
.skel{background:linear-gradient(90deg,var(--hair) 25%,#FFF7EA 50%,var(--hair) 75%);
  background-size:200% 100%;animation:sh 1.3s infinite;border-radius:10px;height:15px;margin:10px 0}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════════════
   KangaToDo — Accelerated Experiences LLC
   A grown-up pops a job in; it hops to the right kid's pouch and nobody else's.
   The SERVER decides which jobs a kid may see. This file never does.
   ══════════════════════════════════════════════════════════════════════════ */

const API   = '/api/kangatodo';
const ALERT = '/api/kangatodo-alert';
const $  = (s,r)=> (r||document).querySelector(s);
const el = (t,a,h)=>{const n=document.createElement(t);if(a)for(const k in a){
  if(k==='class')n.className=a[k];else if(k.startsWith('on'))n.addEventListener(k.slice(2),a[k]);
  else if(a[k]!==null&&a[k]!==false)n.setAttribute(k,a[k]);}
  if(h!=null)n.innerHTML=h;return n;};
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const store={
  get(k){try{return JSON.parse(localStorage.getItem('kangatodo:'+k));}catch{return null;}},
  set(k,v){try{localStorage.setItem('kangatodo:'+k,JSON.stringify(v));}catch{}},
  del(k){try{localStorage.removeItem('kangatodo:'+k);}catch{}},
};
let toastT;
function toast(msg,ms){const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms||2600);}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms||8);}catch{}}

/* A date we cannot parse must never reach the screen as "Invalid Date". */
function dayLabel(iso){
  const d=new Date(String(iso||'')+'T12:00:00');
  if(isNaN(d)) return 'Today';
  return d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
}
/* Photos live in a PRIVATE store, so the browser cannot fetch one by URL.
   We ask the server, which checks who is asking before handing over the bytes.
   Cached per chore so opening the same photo twice costs one round trip. */
const _shots={};
async function loadShot(img, body){
  const k=JSON.stringify(body);
  if(_shots[k]){ img.src=_shots[k]; return true; }
  const r=await api(API,{do:'photo.view',...body});
  if(!r.ok||!r.dataUrl){ img.replaceWith(el('span',{class:'meta'},'photo unavailable')); return false; }
  _shots[k]=r.dataUrl; img.src=r.dataUrl; return true;
}
async function api(url,body){
  const hh=store.get('hh'); if(hh) body={...body,hh};
  try{
    const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},
                            body:JSON.stringify(body),cache:'no-store'});
    return await r.json();
  }catch(e){return {ok:false,reason:'offline',detail:String(e.message||e)};}
}

const starPath=(x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})"><path class="pstar"
  d="M0 -9 L2.6 -2.8 9.3 -2.2 4.2 2.2 5.7 8.8 0 5.3 -5.7 8.8 -4.2 2.2 -9.3 -2.2 -2.6 -2.8 Z"
  fill="${s>.85?'#E09B12':'#F7C948'}"/></g>`;

/** Paint the pouch. `animate` staggers them in so a finished job feels like it landed. */
function paintPouch(done,total,animate){
  const g=$('#pouchStars'); if(!g) return;
  // One finished job = one star. The pouch holds five, so past five it stays full —
  // it never shows more stars than jobs actually done.
  const n=Math.min(5,Math.max(0,done));
  const spots=STAR_SPOTS[n]||[];
  g.innerHTML=spots.map(([x,y,s])=>starPath(x,y,s)).join('');
  const stars=g.querySelectorAll('.pstar');
  stars.forEach((st,i)=>{ if(animate) setTimeout(()=>st.classList.add('in'),90+i*70);
                          else st.classList.add('in'); });
}

  async toggle(c,row,tick){

    this.paintProgress(next);

    const r=await api(API,{do:'kid.done',token:this.token,choreId:c.id,done:next});
    if(!r.ok){
      c.done=!next;tick.setAttribute('aria-checked',String(!next));row.dataset.done=!next?'1':'0';
      this.data.done=before;this.paintProgress(false);toast(why(r.reason)[0]);return;
    }
    if(this.data.done===this.data.total&&this.data.total>0){
      buzz(34);const g=$('.roo');if(g){g.classList.add('hop');setTimeout(()=>g.classList.remove('hop'),900);}

    document.body.append(inp);
    inp.onchange=async()=>{
      const file=inp.files&&inp.files[0]; inp.remove();
      if(!file) return;
      const btn=row.querySelector('.cam');
      if(btn){btn.disabled=true;btn.style.opacity=.5;}
      toast('Sending your photo…',4000);
      try{
        const dataUrl=await shrinkImage(file);
        const r=await api(API,{do:'kid.proof',token:this.token,choreId:c.id,image:dataUrl});
        if(!r.ok){
          if(btn){btn.disabled=false;btn.style.opacity=1;}
          return toast(why(r.reason)[0]);
        }
        buzz(30); toast('Sent! They can see it now.',3000);
        await this.load();
      }catch(e){
        if(btn){btn.disabled=false;btn.style.opacity=1;}
        toast('That photo would not open.');
      }
    };
    inp.click();
  },

  paintProgress(animate){
    const {done,total}=this.data;
    paintPouch(done,total,animate);
    const bar=$('.bar i'); if(bar) bar.style.width=(total?Math.round(done/total*100):0)+'%';
    const tg=$('.togo'); if(tg&&total-done>0) tg.innerHTML=`<b>${total-done}</b> to go${done?` · ${done} in the pouch`:''}`;
  },

  async pushSlot(){
    const slot=$('#pushslot'); if(!slot) return;
    const st=await api(API,{do:'status'});
    const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
    const iOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
    const supported='serviceWorker' in navigator&&'PushManager' in window;

    if(!st.push){slot.innerHTML=`<div class="notice">Buzzing is not switched on yet. A grown-up needs to finish setting it up.</div>`;return;}
    if(iOS&&!standalone){slot.innerHTML=`<div class="notice"><b>Make this buzz</b><br>
      Tap <b>Share</b> at the bottom of Safari, then <b>Add to Home Screen</b>. Open KangaToDo from there
      and your phone can buzz when a job hops in. (Apple only allows it that way.)</div>`;return;}
    if(!supported){slot.innerHTML=`<div class="notice">This browser cannot buzz. Try Safari or Chrome.</div>`;return;}
    if(Notification.permission==='granted'&&store.get('pushed')){slot.innerHTML='';return;}
    if(Notification.permission==='denied'){slot.innerHTML=`<div class="notice">Notifications are switched off for KangaToDo in your phone settings. Turn them on there to get buzzed.</div>`;return;}
    slot.innerHTML=`<div class="card">
      <h2>Get buzzed</h2><div class="sub">So you know the moment a job hops in.</div>
      <button class="btn sun" id="allow">Yes, buzz me</button></div>`;
    $('#allow').onclick=()=>this.subscribe(st.vapidPublicKey);
  },

  async offerPush(){setTimeout(()=>this.pushSlot(),500);},

  async subscribe(vapidPub){
    const b=$('#allow');b.disabled=true;b.textContent='Asking…';
    try{
      const perm=await Notification.requestPermission();
      if(perm!=='granted'){b.disabled=false;b.textContent='Yes, buzz me';return toast('No problem — you can switch it on later.');}
      const reg=await navigator.serviceWorker.register('./sw.js');
      await navigator.serviceWorker.ready;
      const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8(vapidPub)});
      const r=await api(API,{do:'kid.push',token:this.token,subscription:sub.toJSON()});
      if(!r.ok){b.disabled=false;b.textContent='Try again';return toast(why(r.reason)[0]);}
      store.set('pushed',true);
      await api(ALERT,{do:'test',token:this.token});   // prove it buzzes; never just claim it
      toast('All set — watch for the test buzz!',3200);
      this.pushSlot();
    }catch(e){b.disabled=false;b.textContent='Yes, buzz me';toast('This phone would not allow it.');}
  },
};
/* Shrink on the PHONE before uploading. A kid's camera produces 4 MB files;
   we send about 150 KB. Saves their data, our storage, and the wait. */
async function shrinkImage(file, max=1200, q=.72){
  const img = await createImageBitmap(file, {imageOrientation:'from-image'});
  const s = Math.min(1, max/Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  img.close && img.close();
  return c.toDataURL('image/jpeg', q);
}

function urlB64ToUint8(s){
  const pad='='.repeat((4-s.length%4)%4);
  const raw=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/'));
  const out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);
  return out;
}

      if(!email||!password) return toast('Email and password, please.');
      const b=$('#signin'); b.disabled=true; b.textContent='Connecting…';
      const r=await api(API,{do:'parent.connect',email,password});
      if(!r.ok){ b.disabled=false; b.textContent='Connect my Skylight'; return this.renderSignIn(s,r); }
      store.set('hh',r.hh); toast('Connected!',2500);
      await this.refreshStatus();
    };
    $('#signin').onclick=go;
    $('#pw').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  },

  aboutCard(){return `<div class="card"><h2>What KangaToDo does</h2>
    <div class="sub">Plainly, so you know what you are installing.</div>
    <div style="font-size:14.5px;line-height:1.65;color:var(--ink2)">
      You type a job here and pick a kid. It is written into <b>your own Skylight account</b>, so it turns up
      on your Skylight Calendar and on that child's Buddy exactly as if you had typed it there.
      Then KangaToDo buzzes that child's phone — and only that child's.
      <div style="height:10px"></div>
      Skylight does not publish an API and does not send notifications to phones. KangaToDo signs in to
      Skylight the same way their own app does, from the server, and does the phone side itself.
      If Skylight changes their app, this can need a patch — it will tell you so rather than quietly failing.
    </div></div>`;},

  async pane(){const p=$('#pane');
    if(this.tab==='today')return this.paneToday(p);
    if(this.tab==='assign')return this.paneAssign(p);
    if(this.tab==='kids')return this.paneKids(p);},

  async ensureChildren(force){
    if(this.children.length&&!force)return this.children;
    const r=await api(API,{do:'children',pin:this.pin});
    if(!r.ok){this.lastErr=r;this.children=[];return [];}
    this.children=r.children||[];this.frame=r.frame;this.lastErr=null;return this.children;
  },

  async paneToday(p){
    p.innerHTML=`<div class="card"><div class="skel" style="width:50%"></div><div class="skel" style="width:85%"></div></div>`;
    const kids=await this.ensureChildren();
    if(this.lastErr)return p.innerHTML=`<div class="card">${noticeFor(this.lastErr)}</div>`;
    const r=await api(API,{do:'chores',pin:this.pin,from:this.date||undefined});
    if(!r.ok)return p.innerHTML=`<div class="card">${noticeFor(r)}</div>`;
    this.chores=r.chores||[];this.date=r.from;
    const byKid={};for(const c of this.chores){(byKid[c.categoryId]=byKid[c.categoryId]||[]).push(c);}
    const dateTxt=dayLabel(r.from);

    let html=`<div class="card"><h2>${esc(dateTxt)}</h2>
      <div class="sub">${this.chores.length} job${this.chores.length===1?'':'s'} · ${this.chores.filter(c=>c.done).length} in pouches</div>`;
    if(!this.chores.length){
      html+=`<div class="empty"><div class="big">Nothing on today</div>
        <div>Use <b>Pop one in</b> to add a job.</div></div>`;
    }else{
      for(const kid of kids){
        const list=byKid[kid.categoryId];if(!list||!list.length)continue;
        html+=`<div style="margin-top:16px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
            <span style="width:11px;height:11px;border-radius:50%;background:${esc(kid.color)};display:block"></span>
            <b style="font-family:var(--round);font-weight:600;font-size:15.5px">${esc(kid.name)}</b>
            <span style="font-size:13px;color:var(--mut)">${list.filter(c=>c.done).length}/${list.length}</span>
            ${kid.linked?'':'<span style="font-size:12px;color:var(--warn)">· no phone joined</span>'}
          </div><div data-kid="${esc(kid.categoryId)}"></div></div>`;
      }
      const orphan=this.chores.filter(c=>!kids.some(k=>k.categoryId===c.categoryId));
      if(orphan.length)html+=`<div style="margin-top:16px"><div style="font-size:13px;color:var(--mut);margin-bottom:2px">Not given to anyone</div><div data-kid="__none"></div></div>`;
    }
    p.innerHTML=html+`</div>`;

    const put=(cid,list)=>{
      const host=p.querySelector(`[data-kid="${cid}"]`);if(!host)return;
      list.forEach(c=>{
        const row=el('div',{class:'chore','data-done':c.done?'1':'0'});
        const tick=el('button',{class:'tick',role:'checkbox','aria-checked':String(c.done),
          'aria-label':(c.done?'Mark not done: ':'Mark done: ')+c.summary},
          '<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>');
        tick.onclick=async()=>{
          const nx=!c.done;c.done=nx;tick.setAttribute('aria-checked',String(nx));row.dataset.done=nx?'1':'0';buzz(10);
          const rr=await api(API,{do:'chore.complete',pin:this.pin,choreId:c.id,done:nx});
          if(!rr.ok){c.done=!nx;tick.setAttribute('aria-checked',String(!nx));row.dataset.done=!nx?'1':'0';toast(why(rr.reason)[0]);}
        };
        const del=el('button',{class:'rm',title:'Remove','aria-label':'Remove '+c.summary},
          '<svg viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V5.5A1.5 1.5 0 0 1 11 4h2a1.5 1.5 0 0 1 1.5 1.5V7"/><path d="M6.5 7 7.6 19a1.5 1.5 0 0 0 1.5 1.4h5.8a1.5 1.5 0 0 0 1.5-1.4L17.5 7"/></svg>');
        del.onclick=async()=>{
          if(!confirm(`Remove "${c.summary}"${c.recurring?' and every repeat of it':''}?`))return;
          del.disabled=true;
          const rr=await api(API,{do:'chore.delete',pin:this.pin,choreId:c.recurring?c.group:c.id,all:true});
          if(!rr.ok){del.disabled=false;return toast(why(rr.reason)[0]);}
          row.remove();toast('Removed.');
        };
        const meta=[];if(c.time)meta.push(esc(c.time));
        if(c.recurring)meta.push('repeats');
        if(c.points)meta.push(`<span class="star">${c.points} ★</span>`);
        if(c.needsProof&&!c.photo)meta.push('<span class="needs">photo needed</span>');
        row.append(tick,el('div',{class:'body'},
          `<div class="ttl">${c.emoji?esc(c.emoji)+' ':''}${esc(c.summary)}</div>`+
          (meta.length?`<div class="meta">${meta.join('<span style="opacity:.4">·</span>')}</div>`:'')));
        if(c.photo){
          const t=el('img',{class:'thumb',alt:'Photo from '+(c.childName||'them'),loading:'lazy'});
          const days=this.status&&this.status.photoDays?this.status.photoDays:7;
          t.onclick=()=>{
            const box=row.nextElementSibling;
            if(box&&box.classList.contains('shotwrap')){box.remove();return;}
            const big=el('img',{alt:'Photo of '+c.summary});
            const w=el('div',{class:'shotwrap'});
            w.append(big, el('div',{style:'font-size:12.5px;color:var(--mut);margin-top:6px'},
              'Kept '+days+' days, then deleted automatically. Save it to your phone if you want to keep it.'));
            row.after(w);
            loadShot(big,{choreId:c.id,pin:this.pin});
          };
          row.append(t);
          loadShot(t,{choreId:c.id,pin:this.pin});
        }
        row.append(del);
        host.append(row);
      });
    };
    for(const kid of kids)if(byKid[kid.categoryId])put(kid.categoryId,byKid[kid.categoryId]);
    const orphan=this.chores.filter(c=>!kids.some(k=>k.categoryId===c.categoryId));
    if(orphan.length)put('__none',orphan);
  },

  async paneAssign(p){
    p.innerHTML=`<div class="card"><div class="skel" style="width:45%"></div><div class="skel" style="width:75%"></div></div>`;
    const kids=await this.ensureChildren();
    if(this.lastErr)return p.innerHTML=`<div class="card">${noticeFor(this.lastErr)}</div>`;
    if(!kids.length)return p.innerHTML=`<div class="card"><div class="empty">
      <div class="big">No kids on this Skylight yet</div>
      <div>Add a family member in the Skylight app first — KangaToDo reads them from there.</div></div></div>`;

    const today=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
    p.innerHTML=`<div class="card">
      <h2>Pop a job in</h2><div class="sub">It lands on your Skylight and buzzes their phone.</div>
      <label class="lbl">Whose pouch?</label>
      <div class="kids" id="kidpick" role="group" aria-label="Choose a child"></div>
      <label class="lbl" for="sum">What is the job?</label>
      <input id="sum" class="inp" placeholder="Feed the dog" maxlength="120" autocomplete="off">
      <div class="row">
        <div><label class="lbl" for="dt">Day</label><input id="dt" class="inp" type="date" value="${today}"></div>
        <div><label class="lbl" for="tm">Time <span style="font-weight:400">(optional)</span></label><input id="tm" class="inp" type="time"></div>
      </div>
      <div class="row">
        <div><label class="lbl" for="rep">Repeat</label>
          <select id="rep" class="inp"><option value="">Just this day</option>
            <option value="DAILY">Every day</option><option value="WEEKDAY">Weekdays</option>
            <option value="WEEKLY">Every week</option></select></div>
        <div><label class="lbl" for="pts">Stars <span style="font-weight:400">(optional)</span></label>
          <input id="pts" class="inp" type="number" min="0" max="99" placeholder="—"></div>
      </div>
      <label class="check" for="proof">
        <input type="checkbox" id="proof">
        <span><b>Needs a photo</b><span>They have to snap a picture of it done before it ticks off.</span></span>
      </label>
      <div style="height:16px"></div>
      <button class="btn" id="save">Send it hopping</button>
      <div id="result"></div></div>`;

    const host=$('#kidpick');
    kids.forEach(k=>{
      const b=el('button',{class:'kid','aria-pressed':String(this.sel===k.categoryId)},
        `<div class="swatch" style="background:${esc(k.color)}">${esc((k.name||'?')[0].toUpperCase())}</div>
         <div class="nm">${esc(k.name)}</div>
         <div class="st">${k.linked?'phone joined':'no phone yet'}</div>`);
      b.onclick=()=>{this.sel=k.categoryId;buzz(6);
        host.querySelectorAll('.kid').forEach(x=>x.setAttribute('aria-pressed','false'));
        b.setAttribute('aria-pressed','true');};
      host.append(b);
    });

    $('#save').onclick=async()=>{
      const summary=$('#sum').value.trim();
      if(!this.sel)return toast('Pick whose pouch it goes in.');
      if(!summary)return toast('Say what the job is.');
      const btn=$('#save');btn.disabled=true;btn.textContent='Sending…';
      const rep=$('#rep').value,tm=$('#tm').value||null,hour=tm?Number(tm.slice(0,2)):null;
      let rset=null;
      if(rep==='DAILY')rset=[`RRULE:FREQ=DAILY;INTERVAL=1${hour!==null?';BYHOUR='+hour:''}`];
      if(rep==='WEEKDAY')rset=[`RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR${hour!==null?';BYHOUR='+hour:''}`];
      if(rep==='WEEKLY')rset=[`RRULE:FREQ=WEEKLY;INTERVAL=1${hour!==null?';BYHOUR='+hour:''}`];

      const r=await api(API,{do:'chore.create',pin:this.pin,summary,categoryId:this.sel,
        date:$('#dt').value,time:tm,recurring:!!rset,recurrence_set:rset,
        points:$('#pts').value?Number($('#pts').value):null,
        needsProof:$('#proof').checked});
      btn.disabled=false;btn.textContent='Send it hopping';
      if(!r.ok)return $('#result').innerHTML=noticeFor(r);

      const a=await api(ALERT,{do:'flush'});
      const line=(a.pushed||[]).find(x=>x.choreId===(r.created[0]||{}).id)||(a.pushed||[])[0];
      let msg;
      if(!line)msg='Saved to your Skylight.';
      else if(line.delivered>0)msg=`Sent — ${line.child}'s phone just buzzed.`;
      else if(line.smsArmed)msg=`Saved. ${line.child}'s phone isn't joined — a text will go out.`;
      else msg=`Saved to your Skylight. ${line.child} has no phone joined yet.`;
      $('#sum').value='';$('#pts').value='';$('#proof').checked=false;
      $('#result').innerHTML=`<div class="notice good"><b>${esc(msg)}</b>${a.note?'<br>'+esc(a.note):''}</div>`;
      buzz(20);this.chores=[];
    };
  },

  async paneKids(p){
    p.innerHTML=`<div class="card"><div class="skel" style="width:45%"></div><div class="skel" style="width:75%"></div></div>`;
    const kids=await this.ensureChildren(true);
    if(this.lastErr)return p.innerHTML=`<div class="card">${noticeFor(this.lastErr)}</div>`;
    p.innerHTML=`<div id="parentbuzz"></div>
      <div class="card"><h2>Kids &amp; phones</h2>
      <div class="sub">Each kid gets their own code. One code joins one phone, and that phone only ever sees that kid's pouch.</div>
      <div id="kidlist"></div></div>
      ${this.status&&!this.status.sms?`<div class="notice"><b>Text backup is off.</b><br>
        A kid with no joined phone simply gets no alert. KangaToDo will not pretend otherwise —
        join their phone with a code above and they get buzzed properly.</div>`:''}`;

    const host=$('#kidlist');
    kids.forEach(k=>{
      const box=el('div',{style:'padding:15px 0;border-bottom:2px solid var(--hair)'});
      box.innerHTML=`<div style="display:flex;align-items:center;gap:11px">
          <div style="background:${esc(k.color)};width:34px;height:34px;border-radius:12px;display:grid;
               place-items:center;color:#fff;font-weight:700;font-family:var(--round);font-size:15px;flex:none">
            ${esc((k.name||'?')[0].toUpperCase())}</div>
          <div style="flex:1;min-width:0">
            <div style="font-family:var(--round);font-weight:600;font-size:16px">${esc(k.name)}</div>
            <div style="font-size:13px;color:var(--mut)">${k.devices?`${k.devices} phone${k.devices===1?'':'s'} joined`:'No phone joined'}</div>
          </div></div>
        <div class="row" style="margin-top:11px">
          <button class="btn ghost sm" data-a="code" style="flex:1">Get a join code</button>
          ${k.devices?`<button class="btn ghost sm" data-a="unlink" style="flex:none">Unjoin</button>`:''}
        </div><div data-slot></div>`;

      box.querySelector('[data-a="code"]').onclick=async(e)=>{
        const b=e.currentTarget;b.disabled=true;b.textContent='…';
        const r=await api(API,{do:'child.code',pin:this.pin,categoryId:k.categoryId});
        b.disabled=false;b.textContent='Get a join code';
        const slot=box.querySelector('[data-slot]');
        if(!r.ok)return slot.innerHTML=noticeFor(r);
        slot.innerHTML=`<div class="code">${esc(r.code)}</div>
          <div class="codehint">On ${esc(k.name)}'s phone open<br>
            <b>aexperiences.com/apps/kangatodo/#kid</b><br>and type this code. It lasts one hour.</div>`;
        buzz(12);
      };
      const un=box.querySelector('[data-a="unlink"]');
      if(un)un.onclick=async()=>{
        if(!confirm(`Unjoin every phone for ${k.name}? They will need a new code.`))return;
        const r=await api(API,{do:'child.unlink',pin:this.pin,categoryId:k.categoryId});
        if(!r.ok)return toast(why(r.reason)[0]);
        toast('Unjoined.');this.paneKids(p);
      };

      const ph=el('details',{class:'fold'});
      if(k.phone)ph.setAttribute('open','');
      ph.innerHTML=`<summary>${k.phone?'Text number: '+esc(k.phone):'Add a number to text if the buzz fails'}</summary>
        <div class="row" style="margin-top:4px">
          <input class="inp" data-ph inputmode="tel" placeholder="${k.phone?esc(k.phone):'(optional)'}"
                 aria-label="Phone number to text ${esc(k.name)}">
          <button class="btn ghost sm" data-save style="flex:none">Save</button></div>`;
      ph.querySelector('[data-save]').onclick=async()=>{
        const v=ph.querySelector('[data-ph]').value.trim();
        const r=await api(API,{do:'child.phone',pin:this.pin,categoryId:k.categoryId,phone:v});
        if(!r.ok)return toast(why(r.reason)[0]);
        toast(r.phone?'Saved.':'Number removed.');this.paneKids(p);
      };
      box.append(ph);host.append(box);
    });
    host.append(el('div',{id:'pincard',style:'padding-top:18px'}));
    this.pinCard();
    host.append(el('div',{style:'padding-top:16px'},
      `<button class="btn ghost sm" id="signout" style="width:100%">Disconnect Skylight</button>`));
    $('#signout').onclick=async()=>{
      if(!confirm('Disconnect Skylight? Every kid phone will need a new code.'))return;
      await api(API,{do:'parent.disconnect',hh:store.get('hh')});
      store.del('hh'); toast('Disconnected.'); this.status=null; await this.refreshStatus();
    };
    this.buzzCard();
  },

  /* The grown-up lock. Optional on purpose — a parent who doesn't want one
     shouldn't be made to invent a number they'll forget. */
  pinCard(){
    const slot=$('#pincard'); if(!slot) return;
    const on=!!(this.status&&this.status.pinSet);
    slot.innerHTML=`<div class="card">
      <h2>Grown-ups-only PIN</h2>
      <div class="sub">${on
        ? 'On. This side asks for the PIN before it opens.'
        : 'Off. Anyone holding this phone can open the grown-up side. Add one if the kids use your phone.'}</div>
      <input id="np" class="inp" type="password" inputmode="numeric" maxlength="8" autocomplete="off"
             placeholder="${on?'New PIN (4–8 digits)':'Choose a PIN (4–8 digits)'}"
             style="text-align:center">
      <div style="height:12px"></div>
      <button class="btn sun" id="setpin">${on?'Change it':'Turn it on'}</button>
      ${on?`<div style="height:10px"></div>
        <button class="btn ghost sm" id="clearpin" style="width:100%">Turn it off</button>`:''}
    </div>`;
    const save=async(np)=>{
      const r=await api(API,{do:'parent.pin',hh:store.get('hh'),pin:this.pin,newPin:np});
      if(!r.ok) return toast(why(r.reason)[0]||'That did not work.');
      if(np===null){ this.pin=''; store.del('pin'); toast('PIN off.'); }
      else { this.pin=np; store.set('pin',np); toast('PIN saved.'); }
      this.status=await api(API,{do:'status',hh:store.get('hh')});
      this.pinCard();
    };
    $('#setpin').onclick=()=>{
      const v=$('#np').value.trim();
      if(!/^[0-9]{4,8}$/.test(v)) return toast('4 to 8 digits, please.');
      save(v);
    };
    const c=$('#clearpin');
    if(c) c.onclick=()=>{ if(confirm('Turn the PIN off? Anyone with this phone can then open the grown-up side.')) save(null); };
  },

  /* Your own phone, subscribed the same way a kid's is. */
  async buzzCard(){
    const slot=$('#parentbuzz'); if(!slot) return;
    const st=this.status||{};
    if(!st.push){slot.innerHTML=`<div class="notice">Buzzing is off, so you will not be told when a job is finished.</div>`;return;}
    const iOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
    const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
    if(iOS&&!standalone){
      slot.innerHTML=`<div class="notice"><b>Get told when they finish</b><br>
        Tap <b>Share</b> then <b>Add to Home Screen</b>, and open KangaToDo from there.
        Apple only allows notifications that way.</div>`;return;
    }
    if(!('serviceWorker' in navigator&&'PushManager' in window)){slot.innerHTML='';return;}
    if(Notification.permission==='granted'&&store.get('parentPushed')){
      slot.innerHTML=`<div class="notice good" style="display:flex;align-items:center;gap:10px;justify-content:space-between">
        <span><b>You get buzzed when a job is finished.</b></span>
        <button class="btn ghost sm" id="unbuzz" style="flex:none">Stop</button></div>`;
      $('#unbuzz').onclick=async()=>{
        await api(API,{do:'parent.unpush',pin:this.pin});
        store.del('parentPushed');toast('Stopped.');this.buzzCard();
      };
      return;
    }
    slot.innerHTML=`<div class="card">
      <h2>Tell me when they finish</h2>
      <div class="sub">A buzz the moment a job is ticked off — with the photo, when there is one.</div>
      <button class="btn sun" id="pbuzz">Buzz my phone</button></div>`;
    $('#pbuzz').onclick=async()=>{
      const b=$('#pbuzz');b.disabled=true;b.textContent='Asking…';
      try{
        const perm=await Notification.requestPermission();
        if(perm!=='granted'){b.disabled=false;b.textContent='Buzz my phone';return toast('No problem — you can switch it on later.');}
        const reg=await navigator.serviceWorker.register('./sw.js');
        await navigator.serviceWorker.ready;
        const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8(this.status.vapidPublicKey)});
        const r=await api(API,{do:'parent.push',pin:this.pin,subscription:sub.toJSON()});
        if(!r.ok){b.disabled=false;b.textContent='Try again';return toast(why(r.reason)[0]);}
        store.set('parentPushed',true);toast('Done — this phone will buzz.',3000);this.buzzCard();
      }catch(e){b.disabled=false;b.textContent='Buzz my phone';toast('This phone would not allow it.');}
    };
  },
};

/* ═══════════════════════════════ boot ═══════════════════════════════ */
(function boot(){
  const isKid=location.hash.replace(/^#\/?/,'').toLowerCase().startsWith('kid')||!!store.get('kidToken');
  if(isKid)Kid.start();else Parent.start();
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'&&document.body.classList.contains('kid')&&Kid.token)Kid.load();
  });
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
    navigator.serviceWorker.addEventListener('message',(e)=>{
      if(e.data&&e.data.type==='refresh'&&Kid.token)Kid.load();
    });
  }
})();
</script>
