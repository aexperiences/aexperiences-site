<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
<defs>
<linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
<stop offset="0%" stop-color="#5b7f96"/><stop offset="46%" stop-color="#34546a"/><stop offset="100%" stop-color="#14232e"/></linearGradient>
<linearGradient id="glare" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#fff" stop-opacity=".20"/><stop offset="44%" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="pap" x1="0" y1="0" x2="0.3" y2="1">
<stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#ece8dc"/></linearGradient>
<linearGradient id="trace" x1="0" y1="0" x2="0.3" y2="1">
<stop offset="0%" stop-color="#fbf7ec"/><stop offset="100%" stop-color="#e7dfc9"/></linearGradient>
<linearGradient id="brassy" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#e2b86c"/><stop offset="100%" stop-color="#9a6f2c"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#e3e8ec"/><stop offset="100%" stop-color="#9aa5ad"/></linearGradient>

</defs>
<rect width="1024" height="1024" fill="url(#tile)"/><rect width="1024" height="1024" fill="url(#glare)"/>
<ellipse cx="512" cy="900" rx="350" ry="30" fill="#000" opacity=".38"/>
<g transform="rotate(9 590.0 550.0)"><rect x="330" y="250" width="520" height="600" rx="14" fill="#000" opacity=".35" transform="translate(12 16)"/><rect x="330" y="250" width="520" height="600" rx="14" fill="url(#trace)"/></g><g transform="rotate(4 540.0 530.0)"><rect x="280" y="230" width="520" height="600" rx="14" fill="#000" opacity=".35" transform="translate(12 16)"/><rect x="280" y="230" width="520" height="600" rx="14" fill="url(#trace)"/></g><g transform="rotate(-2 480.0 510.0)"><rect x="220" y="210" width="520" height="600" rx="14" fill="#000" opacity=".35" transform="translate(12 16)"/><rect x="220" y="210" width="520" height="600" rx="14" fill="url(#pap)"/>
  <!-- border + title block down the right, the way a real sheet is laid out -->
  <rect x="246" y="236" width="468" height="548" fill="none" stroke="#7d8288" stroke-width="4"/>
  <rect x="628" y="236" width="86" height="548" fill="#dfe8ee"/>
  <rect x="628" y="236" width="86" height="548" fill="none" stroke="#7d8288" stroke-width="4"/>
  <rect x="628" y="330" width="86" height="3" fill="#7d8288"/><rect x="628" y="420" width="86" height="3" fill="#7d8288"/><rect x="628" y="510" width="86" height="3" fill="#7d8288"/><rect x="628" y="600" width="86" height="3" fill="#7d8288"/><rect x="628" y="690" width="86" height="3" fill="#7d8288"/>
  <!-- a plan on the sheet -->
  <rect x="290" y="300" width="290" height="200" fill="none" stroke="#34546a" stroke-width="9"/>
  <path d="M 290 400 L 470 400 M 470 300 L 470 500 M 380 400 L 380 500" stroke="#34546a" stroke-width="7"/>
  <path d="M 336 300 A 36 36 0 0 1 372 336" fill="none" stroke="#34546a" stroke-width="5"/>
  <path d="M 500 400 A 40 40 0 0 0 540 440" fill="none" stroke="#34546a" stroke-width="5"/>
  <!-- dimension string -->
  <path d="M 290 540 L 580 540" stroke="#c7865a" stroke-width="4"/>
  <path d="M 290 528 L 290 552 M 580 528 L 580 552 M 470 528 L 470 552" stroke="#c7865a" stroke-width="4"/>
  <!-- sheet number, the thing you actually read -->
  <rect x="636" y="700" width="70" height="66" rx="6" fill="#34546a"/>
  </g>
  <!-- revision cloud, hand-drawn, red pencil -->
  <path d="M 330 610 q 20 -30 44 -8 q 20 -30 44 -8 q 20 -30 44 -8 q 24 -24 40 8 q 30 -6 20 30 q 30 10 4 36 q 10 32 -24 26 q -6 30 -36 12 q -20 30 -44 6 q -24 22 -40 -8 q -30 10 -22 -24 q -32 -8 -14 -36 q -20 -30 14 -34 z"
        fill="none" stroke="#b23b2f" stroke-width="7" stroke-linejoin="round" transform="rotate(-2 480 520)"/>
  <circle cx="392" cy="644" r="22" fill="#b23b2f" transform="rotate(-2 480 520)"/>

</svg>
