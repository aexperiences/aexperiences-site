<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="gq" x1="0" y1="0" x2="0.7" y2="1"><stop offset="0%" stop-color="#a9c4a0"/><stop offset="55%" stop-color="#5f8a5a"/><stop offset="100%" stop-color="#1f3a22"/></linearGradient>
<radialGradient id="glq" cx="32%" cy="6%" r="80%"><stop offset="0%" stop-color="#ffffff" stop-opacity=".26"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<linearGradient id="brq" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e2b86c"/><stop offset="100%" stop-color="#9a6f2c"/></linearGradient>
<radialGradient id="lensA" cx="40%" cy="35%" r="70%"><stop offset="0%" stop-color="#fff5e2" stop-opacity=".95"/><stop offset="100%" stop-color="#e8b083" stop-opacity=".55"/></radialGradient>
<radialGradient id="lensB" cx="60%" cy="35%" r="70%"><stop offset="0%" stop-color="#eaf3ff" stop-opacity=".95"/><stop offset="100%" stop-color="#8aa6c8" stop-opacity=".55"/></radialGradient>
</defs>
<rect width="1024" height="1024" fill="url(#gq)"/>
<ellipse cx="512" cy="900" rx="350" ry="30" fill="#000" opacity=".35"/>
<!-- the desk -->
<rect x="96" y="808" width="832" height="34" rx="14" fill="#4a2a12"/>
<rect x="96" y="808" width="832" height="10" rx="5" fill="#e0a83a"/>
<!-- the sheet under review -->
<g transform="rotate(-4 512 560)">
  <rect x="292" y="330" width="440" height="500" rx="18" fill="#000" opacity=".3" transform="translate(10 14)"/>
  <rect x="292" y="330" width="440" height="500" rx="18" fill="#f7f3e8"/>
  <rect x="332" y="392" width="300" height="16" rx="8" fill="#39406e" opacity=".8"/>
  <rect x="332" y="432" width="360" height="12" rx="6" fill="#39406e" opacity=".35"/>
  <rect x="332" y="462" width="340" height="12" rx="6" fill="#39406e" opacity=".35"/>
  <rect x="332" y="492" width="356" height="12" rx="6" fill="#39406e" opacity=".35"/>
  <rect x="332" y="522" width="300" height="12" rx="6" fill="#39406e" opacity=".35"/>
  <rect x="332" y="552" width="348" height="12" rx="6" fill="#39406e" opacity=".35"/>
  <rect x="332" y="582" width="320" height="12" rx="6" fill="#39406e" opacity=".35"/>
  <rect x="332" y="612" width="356" height="12" rx="6" fill="#39406e" opacity=".35"/>
  <rect x="332" y="642" width="280" height="12" rx="6" fill="#39406e" opacity=".35"/>
</g>
<!-- two lenses, overlapping: they read the same sheet from two sides -->
<g>
  <circle cx="420" cy="520" r="150" fill="url(#lensA)"/>
  <circle cx="420" cy="520" r="150" fill="none" stroke="url(#brq)" stroke-width="26"/>
  <circle cx="420" cy="520" r="150" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="4"/>
  <rect x="268" y="600" width="46" height="200" rx="22" fill="#4a2a12" transform="rotate(38 291 700)"/>
</g>
<g>
  <circle cx="604" cy="520" r="150" fill="url(#lensB)"/>
  <circle cx="604" cy="520" r="150" fill="none" stroke="url(#brq)" stroke-width="26"/>
  <circle cx="604" cy="520" r="150" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="4"/>
  <rect x="710" y="600" width="46" height="200" rx="22" fill="#4a2a12" transform="rotate(-38 733 700)"/>
</g>
<!-- the seal: what the Head releases -->
<g transform="translate(512 250)">
  <circle r="98" fill="#b64a2e"/>
  <circle r="98" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="6" stroke-dasharray="10 9"/>
  <circle r="72" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="5"/>
  <path d="M-38 4 L-10 32 L44 -30" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<rect width="1024" height="1024" fill="url(#glq)"/>
</svg>
