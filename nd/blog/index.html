<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>The Neuro-Divulge — Notes</title>
<meta name="description" content="Notes from a homeschooling family in Post Falls, Idaho.">
<link rel="icon" href="/logo-nd.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/nd/nd-theme.css">
<script>
/* Opened from inside ND OS, Notes stays inside ND OS: same dark (or light) she picked, same
   dock. Anthony, Sep 18 2026: "one of the pages in the OS switches to the other color" - it
   was this one. A reader arriving from anywhere else still gets the light site. */
(function(){
  var inside=false;
  try{
    if(/[?&]in=os\b/.test(location.search)) sessionStorage.setItem('nd:os:inside','1');
    inside = sessionStorage.getItem('nd:os:inside')==='1' || /\/nd\/(os|write)\//.test(document.referrer||'');
  }catch(e){}
  if(!inside) return;
  window.__ND_INSIDE=true;
  try{ document.documentElement.setAttribute('data-os-theme', localStorage.getItem('nd:os:theme')||'dark'); }
  catch(e){ document.documentElement.setAttribute('data-os-theme','dark'); }
  document.write('<link rel="stylesheet" href="/nd/os/nd-os.css">');
})();
</script>
<style>
  .post-list{display:flex;flex-direction:column;gap:14px;margin-top:6px}
  .post-list .when{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--nd-terra)}
  .post-list h2{margin:6px 0 4px;font-size:21px}
  .post-list p{margin:0;font-size:15px;color:var(--nd-ink-2)}
  article.post{margin-top:8px}
  article.post h1{margin-bottom:10px}
  article.post .when{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--nd-terra)}
  article.post .dek{font-family:var(--nd-serif);font-size:18px;color:var(--nd-ink-2);margin:10px 0 22px}
  .body{font-size:17.5px;line-height:1.72}
  .body h2{margin:30px 0 10px}
  .body h3{margin:24px 0 8px}
  .body ul,.body ol{margin:0 0 1em;padding-left:22px}
  .body li{margin:.3em 0}
  .body blockquote{margin:22px 0;padding:2px 0 2px 18px;border-left:4px solid var(--nd-sage);
    color:var(--nd-ink-2);font-family:var(--nd-serif);font-style:italic}
  .body hr{border:0;border-top:1px solid var(--nd-rule);margin:28px 0}
  .empty{text-align:center;padding:50px 10px;color:var(--nd-ink-2)}
</style>
</head><body>
<header class="mast"><div class="wrap">
  <img src="/logo-nd.png" alt="">
  <div><div class="wordmark">The Neuro<em>~</em>Divulge</div><div class="subword">Notes</div></div>
  <a class="back" href="/nd/">&larr; Home</a>
</div></header>

<main class="wrap" id="main" style="padding-block:26px 10px">
  <div id="view"><p class="muted">Loading…</p></div>
</main>

<footer><div class="wrap">
  <a class="aemark" href="/shop.html">
    <img src="/marks/ae-mark-gradient.png" alt="Accelerated Experiences, LLC">
    <span><b>Built by Accelerated Experiences, LLC</b>Post Falls, Idaho</span>
  </a>
</div></footer>

<script>
(function(){
  var view=document.getElementById('view');

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  /* Markdown, small and deliberate. Everything is escaped FIRST, so a post can never
     inject markup - the author writes text, not HTML. */
  function md(src){
    var lines=String(src||'').replace(/\r\n?/g,'\n').split('\n');
    var out=[],list=null;
    function closeList(){ if(list){ out.push('</'+list+'>'); list=null; } }
    function inline(t){
      t=esc(t);
      t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" rel="noopener">$1</a>');
      t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
      t=t.replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>');
      t=t.replace(/`([^`]+)`/g,'<code>$1</code>');
      return t;
    }
    for(var i=0;i<lines.length;i++){
      var l=lines[i], m;
      if(!l.trim()){ closeList(); continue; }
      if(/^---+$/.test(l.trim())){ closeList(); out.push('<hr>'); continue; }
      if((m=l.match(/^(#{2,3})\s+(.*)$/))){ closeList();
        out.push('<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>'); continue; }
      if((m=l.match(/^>\s?(.*)$/))){ closeList(); out.push('<blockquote>'+inline(m[1])+'</blockquote>'); continue; }
      if((m=l.match(/^[-*]\s+(.*)$/))){ if(list!=='ul'){closeList();out.push('<ul>');list='ul';}
        out.push('<li>'+inline(m[1])+'</li>'); continue; }
      if((m=l.match(/^\d+[.)]\s+(.*)$/))){ if(list!=='ol'){closeList();out.push('<ol>');list='ol';}
        out.push('<li>'+inline(m[1])+'</li>'); continue; }
      closeList(); out.push('<p>'+inline(l)+'</p>');
    }
    closeList();
    return out.join('\n');
  }

  function when(iso){
    try{ return new Date(iso).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}); }
    catch(e){ return ''; }
  }

  function list(posts){
    if(!posts.length){
      view.innerHTML='<div class="empty"><p>No notes yet.</p><p class="muted">The first one is on its way.</p></div>';
      return;
    }
    view.innerHTML='<div class="eyebrow">Notes</div><div class="rule-paper"><span></span></div>'+
      '<div class="post-list">'+posts.map(function(p){
        return '<a class="card" href="?p='+encodeURIComponent(p.slug)+'">'+
          '<div class="when">'+esc(when(p.createdAt))+'</div>'+
          '<h2>'+esc(p.title)+'</h2>'+
          (p.dek?'<p>'+esc(p.dek)+'</p>':'')+'</a>';
      }).join('')+'</div>';
  }

  function one(p){
    document.title=p.title+' — The Neuro-Divulge';
    view.innerHTML='<article class="post">'+
      '<a class="back" href="/nd/blog/" style="margin:0 0 14px;display:inline-flex">&larr; All notes</a>'+
      '<div class="when">'+esc(when(p.createdAt))+'</div>'+
      '<h1>'+esc(p.title)+'</h1>'+
      (p.dek?'<p class="dek">'+esc(p.dek)+'</p>':'')+
      '<div class="body">'+md(p.body)+'</div></article>';
  }

  var slug=new URL(location.href).searchParams.get('p');
  var url='/api/nd-blog'+(slug?('?slug='+encodeURIComponent(slug)):'');
  fetch(url,{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
    if(!j||!j.ok){
      view.innerHTML='<div class="empty"><p>'+(slug?'That note is not here.':'Notes are not available just now.')+'</p>'+
        (slug?'<p><a href="/nd/blog/">See all notes</a></p>':'')+'</div>';
      return;
    }
    slug?one(j.post):list(j.posts||[]);
  }).catch(function(){
    view.innerHTML='<div class="empty"><p>Could not load notes. Try again in a moment.</p></div>';
  });
})();
</script>

<script>
/* Arriving here from the back end, the way back should be the back end — not the
   public site. A visitor from anywhere else never sees this. */
(function(){
  try{
    var r=document.referrer||'';
    if(!/\/nd\/(os|write)\//.test(r)) return;
    var a=document.querySelector('.mast .back');
    if(a){ a.href='/nd/os/'; a.innerHTML='&larr; ND OS'; }
  }catch(e){}
})();
</script>
<script>
if(window.__ND_INSIDE){
  var s=document.createElement('script'); s.src='/nd/os/nd-os.js';
  s.onload=function(){ if(window.NDOS) NDOS.mount({ active:'notes', primary:{ label:'Write a note', icon:'write',
    onTap:function(){ location.href='/nd/write/'; } } }); };
  document.body.appendChild(s);
}
</script>
</body></html>
